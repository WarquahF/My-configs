# Kitty — minimal, matches the Liquid Glass desktop.
# Deliberately standalone: no theme include (the old themes/noctalia.conf
# dependency is gone with Noctalia disabled).

font_family      MesloLGS Nerd Font Mono
font_size        11.0

# Translucency pairs with Hyprland blur; keep >= 0.8 for readability.
background_opacity 0.85
window_padding_width 16
cursor_trail 1

# Quiet dark defaults; tweak freely.
background #101218
foreground #e8eaf0
cursor #e8eaf0
selection_background #2a2e3a
selection_foreground #e8eaf0
