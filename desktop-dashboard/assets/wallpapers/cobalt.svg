  <ellipse cx="950" cy="670" rx="570" ry="150" fill="#1689ff" opacity=".13" filter="url(#glow)"/>
  <circle cx="915" cy="68" r="5" fill="#c7f4ff"/>
  <rect width="1920" height="1080" filter="url(#grain)"/>
