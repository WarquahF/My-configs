# SDDM Wayland/HiDPI drop-in — copy to /etc/sddm.conf.d/10-wayland.conf.
# Keeps the greeter on Wayland with HiDPI on (1080p @ 1.5x desktop).
# SDDM Wayland support is experimental upstream; X11 fallback is kept
# working by leaving [X11] at defaults.
[Wayland]
EnableHiDPI=true
# Default compositor is weston (often not installed). Uncomment to use
# kwin_wayland instead (needs kwin + layer-shell-qt):
# CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[X11]
EnableHiDPI=true
# ServerArguments=-nolisten tcp -dpi 144
