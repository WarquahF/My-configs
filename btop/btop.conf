#? Minimal btop overrides for this dotfiles repo.
# Only the settings that matter here are pinned; everything else
# falls back to btop defaults. Notably this drops the old
# color_theme = "noctalia" dependency (Noctalia is disabled).

# Built-in theme so no external theme file is required.
color_theme = "Default"

# False lets the terminal (kitty) transparency show through.
theme_background = False

truecolor = True
rounded_corners = True
graph_symbol = "braille"
vim_keys = False
