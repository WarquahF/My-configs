# hyprlock — Liquid Glass lock screen (CachyOS + Hyprland)
#
# Without this file hyprlock refuses to start ("No config file at ..."), so
# Super+L fell through to `loginctl lock-session`, which does nothing when no
# locker is registered: the screen never actually locked. This file is that
# missing config, and it is the only one — every lock entry point (Super+L,
# Super+Alt+L, the wlogout Lock button, power-menu.sh) runs plain `hyprlock`
# and therefore gets exactly this screen.
#
# THE WALLPAPER YOU ARE ACTUALLY USING
# background:path points at one stable file that rofi/wallpaper-picker.sh
# keeps in sync with whatever awww is displaying, so the lock screen shows
# the current wallpaper rather than a flat colour or a screenshot of your
# desktop (a screenshot would also leak whatever was on screen). Re-sync by
# hand with `wallpaper-picker.sh --sync-lock-image`.
# Note: that path is $XDG_CACHE_HOME/wallpaper-picker/... — if you set
# XDG_CACHE_HOME to something non-default, update the path below to match.
#
# AUDIO KEEPS PLAYING
# Nothing here touches audio: hyprlock does not pause players, and no lock
# path in this repo calls anything that would. Volume and media keys keep
# working while locked because hypr/config/capture.lua binds them with
# { locked = true }. The now-playing label below is the visible proof — lock
# the screen mid-song and it keeps updating.
#
# install.sh symlinks this to ~/.config/hypr/hyprlock.conf, so editing this
# file changes the live lock screen.

$font = MesloLGS Nerd Font Mono

general {
    hide_cursor = true
}

auth {
    pam {
        enabled = true
    }
}

# Same ease-out curve the wallpaper transitions and Waybar use, so locking
# and unlocking feel like part of the desktop instead of a hard cut.
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    bezier = glass, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, glass
    animation = fadeOut, 1, 4, glass
    animation = inputFieldDots, 1, 2, linear
}

# The current wallpaper, blurred and dimmed just enough that white text
# stays readable over a busy image. `color` is the fallback used when the
# cached file does not exist yet (fresh install, before the first sync).
background {
    monitor =
    path = ~/.cache/wallpaper-picker/lock-background.jpg
    color = rgba(16, 18, 24, 1.0)
    blur_passes = 3
    blur_size = 6
    brightness = 0.68
    contrast = 0.92
    vibrancy = 0.18
    vibrancy_darkness = 0.05
    noise = 0.008
}

# Clock. $TIME re-renders on its own, no command needed.
label {
    monitor =
    text = $TIME
    font_family = $font
    font_size = 84
    color = rgba(255, 255, 255, 0.94)
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(0, 0, 0, 0.55)

    position = 0, 118
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %-d %B"
    font_family = $font
    font_size = 16
    color = rgba(255, 255, 255, 0.62)
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 56
    halign = center
    valign = center
}

# Now playing. The script prints nothing when no player is running, so the
# row simply disappears instead of showing a placeholder. It is a script and
# not an inline playerctl call because hyprlang parses `{{ }}` as an
# arithmetic expression and playerctl's format language uses `{{ }}` too.
# Locking never pauses the player — this label keeps ticking while locked.
label {
    monitor =
    text = cmd[update:1000] ~/.config/hypr/scripts/now-playing.sh
    font_family = $font
    font_size = 13
    color = rgba(255, 255, 255, 0.72)
    shadow_passes = 1
    shadow_size = 4
    shadow_color = rgba(0, 0, 0, 0.5)

    position = 0, 26
    halign = center
    valign = bottom
}

# Password field, styled like a Waybar island: translucent near-black fill,
# hairline border, 16px rounding.
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 1
    rounding = 16
    dots_size = 0.22
    dots_spacing = 0.3
    dots_center = true

    inner_color = rgba(16, 18, 24, 0.72)
    outer_color = rgba(255, 255, 255, 0.12)
    check_color = rgba(255, 255, 255, 0.30)
    fail_color = rgba(240, 147, 147, 0.90)
    font_color = rgba(255, 255, 255, 0.88)
    font_family = $font

    fade_on_empty = false
    placeholder_text = <i>Unlock $USER</i>
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    position = 0, -64
    halign = center
    valign = center
}
